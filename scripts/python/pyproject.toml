[project]
name = "compliance-pro-lgpd"
version = "1.0.0"
description = "Compliance Pro — LGPD auditing scripts (PII scanner, retention scanner, log scanner, encryption checker)"
authors = [{name = "Nei Maciel", email = "nei@ampler.me"}]
license = {text = "AGPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.7",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
compliance-scan = "compliance_pro.cli:main"
pii-scan = "compliance_pro.pii_scanner:cli"
retention-scan = "compliance_pro.retention_scanner:cli"
log-scan = "compliance_pro.log_scanner:cli"
encryption-check = "compliance_pro.encryption_checker:cli"
audit-integrity = "compliance_pro.audit_log_integrity:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
